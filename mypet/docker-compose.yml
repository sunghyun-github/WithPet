version: '3.8'
services:
  mypet:
    build:
      context: .
      dockerfile: Dockerfile
    image: mypet:latest
    container_name: mypet-container
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/fpjt?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rpass
    depends_on:
      - db
    restart: always  
    networks:
      - mypet-network

  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rpass
      MYSQL_DATABASE: fpjt  
    ports:
      - "3306:3306"
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql  # 데이터 저장용 볼륨 추가
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - mypet-network

networks:
  mypet-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
