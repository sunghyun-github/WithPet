version: '3.8'
services:
  mypet:
    build:
      context: .  # 현재 디렉토리에서 빌드
      dockerfile: Dockerfile  # Dockerfile 지정
    image: mypet:latest  # 빌드된 이미지 이름
    container_name: mypet-container
    ports:
      - "8081:8080"  # 로컬 8081 -> 컨테이너 8080 포트 매핑
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/fpjt?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rpass
      - SPRING_PROFILES_ACTIVE=prod  # Spring 프로파일 설정
      - file.upload-dir=/path/to/upload/directory  # 업로드 디렉토리 경로 설정
      # 이메일 관련 환경 변수는 Jenkins에서 가져옵니다.
      - spring.mail.host=smtp.gmail.com
      - spring.mail.port=587
      - spring.mail.username=${GMAIL_USERNAME}
      - spring.mail.password=${GMAIL_PASSWORD}
      - spring.mail.properties.mail.smtp.auth=true
      - spring.mail.properties.mail.smtp.timeout=5000
      - spring.mail.properties.mail.smtp.starttls.enable=true
    depends_on:
      - db  # DB 서비스 의존성
    restart: always  
    networks:
      - mypet-network

  db:
    image: mysql:8.0  # MySQL 버전
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rpass  # 루트 비밀번호
      MYSQL_DATABASE: fpjt  # 초기 생성 데이터베이스
    ports:
      - "3307:3306"  # 로컬 3306 -> 컨테이너 3306 포트 매핑
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql  # 데이터 영구 저장용 볼륨
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - mypet-network

networks:
  mypet-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
